body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.5 system-ui,-apple-system,sans-serif;
 background:linear-gradient(#FFE7B8,#F9B27A 45%,#EE7A6E 75%,#D9577A);color:#2B2238}
.card{box-sizing:border-box;width:min(92vw,360px);background:#FBF4E8;border-radius:22px;padding:26px 22px;text-align:center;box-shadow:0 10px 0 #7A3B55}

p{margin:6px 0 16px;color:#6E5A60;font-size:15px}

input[type=password]:focus{outline:none;border-color:#D4587C}
label{display:flex;gap:8px;align-items:center;justify-content:center;margin:12px 0;font-size:14px;color:#6E5A60}
button{width:100%;font:700 17px system-ui;padding:13px;border:0;border-radius:12px;background:#D4587C;color:#fff;cursor:pointer}
.err{color:#B3261E;font-size:14px;min-height:20px;margin-top:8px}
