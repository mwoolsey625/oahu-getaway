  err.textContent='';go.textContent='Opening…';go.disabled=true;
  try{
    const raw=await derive(document.getElementById('pw').value.trim());
    const html=await unlock(raw);
    if(document.getElementById('rm').checked){try{localStorage.setItem(K,e(raw))}catch(x){}}
    show(html);
  }catch(x){err.textContent="That password didn't work. Try again.";go.textContent='Open';go.disabled=false}
});
}
</script>
